[package]
name = "digstore-prover"
license = "GPL-2.0-only"
version.workspace = true
edition = "2021"
description = "Execution proofs and Chia chain anchoring for digstore (§13)."

# NC-7: this crate publishes to crates.io. `digstore-host` depends on it as a
# non-optional runtime dependency (`ChainSource`/`Prover` are used from
# `runtime.rs`, `state.rs` and `serve_blind.rs`), so the whole dependent chain
# — digstore-host, digstore-cli, digstore-compiler, digstore-remote — is
# publishable only if this crate is.
#
# The former blocker was a `digstore-guest-risc0 = { path = "guest" }` entry
# under the optional `risc0` feature. Cargo demands a version on every
# dependency when packaging, optional ones included, and that guest is absent
# from crates.io — so the entry made the crate permanently unpublishable.
# It was also DEAD: nothing in `src/` names `digstore_guest_risc0`. The zkVM
# guest is consumed by `risc0-build::embed_methods()` in `build.rs`, which
# locates it through `[package.metadata.risc0] methods = ["guest"]` — a
# directory path, not a Cargo dependency edge. Removing the entry therefore
# restores publishability without touching what the `risc0` feature does.
#
# KNOWN LIMITATION of the published artifact, measured with `cargo package --list`:
# `guest/` is a nested package, and cargo excludes nested packages from a `.crate`
# unconditionally — an explicit `include = ["guest/**"]` does NOT override this. So a
# REGISTRY consumer that turns on `risc0` gets a `build.rs` whose `embed_methods()` has no
# guest directory to compile. The DEFAULT feature set — which is what every consumer in this
# ecosystem uses, and what `digstore-host` needs — is unaffected and fully sound from the
# registry. `risc0` is opt-in and already requires an out-of-band RISC0 toolchain
# (`rzup`/`r0vm`) that no CI here installs, so it is not reachable from a registry build
# either way. Making it registry-reachable needs the guest published as its own crate; that
# is a shape decision, not a flag, and it does not gate this crate's publishability.

[dependencies]
digstore-core = { workspace = true }
digstore-crypto = { workspace = true }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# risc0 backend (real ZK) — all optional, all referenced by the `risc0` feature below
risc0-zkvm = { version = "1.2", optional = true }
bincode = { version = "1", optional = true }

[build-dependencies]
risc0-build = { version = "1.2", optional = true }

[features]
default = []
risc0 = ["dep:risc0-zkvm", "dep:bincode", "dep:risc0-build"]
hardware-attest = []

[dev-dependencies]
serde_json = "1"
httpmock = "0.7"

[package.metadata.risc0]
methods = ["guest"]
