[package]
name = "digstore-compiler"
license = "GPL-2.0-only"
# SPEC 5: "Compiler version 1.0.0". This is NOT a release number — `COMPILER_VERSION` is
# `env!("CARGO_PKG_VERSION")` and is recorded into every compiled `.dig`, so changing it
# changes the store format. It deliberately does not follow the workspace version.
version = "1.0.0"
edition = "2021"
description = "dig-compiler: deterministic transform from on-disk generations to a self-serving WASM module (paper 5, 8.3, 17.1, 19)."

[dependencies]
digstore-core = { workspace = true }
digstore-store = { workspace = true }
# `wasmparser` feature enables `wasm_encoder::reencode` (operator round-trip),
# used by the §17.1 obfuscation pass to decode + re-encode the code section.
wasm-encoder = { version = "0.221", features = ["wasmparser"] }
wasmparser = "0.221"
chacha20 = "0.9"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"

[build-dependencies]
wat = "1"

[dev-dependencies]
wasmtime = "47.0.3"
wasmparser = "0.221"
wat = "1"
digstore-host = { workspace = true }
digstore-prover = { workspace = true }
digstore-crypto = { workspace = true }
