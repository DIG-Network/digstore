[package]
name = "digstore-remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "digstore_remote"
path = "src/lib.rs"

[dependencies]
digstore-core = { path = "../digstore-core" }
digstore-store = { path = "../digstore-store" }
digstore-host = { path = "../digstore-host" }
digstore-crypto = { path = "../digstore-crypto" }
axum = { version = "0.7", features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower = { version = "0.4", features = ["util"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
hex = "0.4"
base64 = "0.22"
getrandom = "0.2"
dirs = "5"
futures-util = { version = "0.3", default-features = false }
async-trait = "0.1"

# Windows-only: explicit owner-only DACL on the identity seed file (Unix uses
# mode 0o600). See `identity::write_secret_file`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

