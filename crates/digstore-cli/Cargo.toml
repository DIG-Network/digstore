[package]
name = "digstore-cli"
license = "GPL-2.0-only"
description = "The digstore command-line interface (`dig-store` / `digs`)."
version.workspace = true
edition = "2021"

# The primary CLI binary. Renamed `digstore` -> `dig-store` (rename epic #703) to
# match the repo's canonical name; a transitional `digstore` -> `dig-store` symlink
# ships in the release tarball + .deb for one cycle so existing scripts keep working.
[[bin]]
name = "dig-store"
path = "src/main.rs"

# `digs` — a FIRST-CLASS alias binary for `dig-store` (issue #434). It shares the
# SINGLE entrypoint `digstore_cli::run()` (see src/bin/digs.rs) so there is no
# duplicated logic; `cargo install` produces BOTH `dig-store` and `digs`, and each
# reflects its own invoked name in --help/--version/completions.
[[bin]]
name = "digs"
path = "src/bin/digs.rs"

[lib]
name = "digstore_cli"
path = "src/lib.rs"

[dependencies]
digstore-core = { workspace = true }
digstore-chain = { workspace = true }
rpassword = "7"
zeroize = "1"
digstore-store = { workspace = true }
digstore-chunker = { workspace = true }
# Pinned to the SPEC compiler version, not the workspace version — see the note in the
# root `[workspace.dependencies]`.
digstore-compiler = { path = "../digstore-compiler", version = "1.0.0" }
digstore-stage = { workspace = true }
digstore-host = { workspace = true }
digstore-prover = { workspace = true }
digstore-remote = { workspace = true }
digstore-crypto = { workspace = true }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
anyhow = "1"
thiserror = "1"
chia-protocol = "0.36.1"
# `store-status` (#1349): the fail-closed on-chain store-status aggregator lives in the `dig-store`
# LIBRARY crate (NC-9, triple-gated); this CLI is a thin consumer of `dig_store::get_store_status`,
# reading through a coinset-backed adapter over the canonical `dig_chainsource_interface::ChainSource`
# trait. NEVER re-implement the status/lineage logic here.
# 0.8 is the release that moved onto `chia-wallet-sdk` 0.36; holding 0.7 would keep the
# workspace resolving the SDK twice once `digstore-chain` is on the 0.36 line.
dig-store = "0.8"
dig-chainsource-interface = "0.3"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# The SAME parser reqwest dials with. Redaction must not re-implement authority parsing:
# a hand-rolled split terminated the authority at `/` only, while the WHATWG parser also
# terminates it at `\`, `?` and `#`, so a displayed host could differ from the dialled one.
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
hex = "0.4"
base64 = "0.22"
getrandom = "0.2"
# `dig-store update` self-updater: extract the `dig-store` binary from a release
# `.tar.gz` asset (Linux aarch64 ships only a tarball). Pure-Rust (miniz_oxide).
flate2 = "1"
tar = "0.4"
anstream = "0.6"
anstyle = "1"
ignore = "0.4"
globset = "0.4"
indicatif = "0.17"
axum = "0.7"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# The in-memory canonical ChainSource for exercising `get_store_status` (Live/Melted/NotFound +
# fail-closed) without a network, and the adapter's transport-mapping tests.
dig-chainsource-interface = { version = "0.3", features = ["testing"] }
