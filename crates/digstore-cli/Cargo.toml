[package]
name = "digstore-cli"
license = "GPL-2.0-only"
version.workspace = true
edition = "2021"

# The primary CLI binary. Renamed `digstore` -> `dig-store` (rename epic #703) to
# match the repo's canonical name; a transitional `digstore` -> `dig-store` symlink
# ships in the release tarball + .deb for one cycle so existing scripts keep working.
[[bin]]
name = "dig-store"
path = "src/main.rs"

# `digs` — a FIRST-CLASS alias binary for `dig-store` (issue #434). It shares the
# SINGLE entrypoint `digstore_cli::run()` (see src/bin/digs.rs) so there is no
# duplicated logic; `cargo install` produces BOTH `dig-store` and `digs`, and each
# reflects its own invoked name in --help/--version/completions.
[[bin]]
name = "digs"
path = "src/bin/digs.rs"

[lib]
name = "digstore_cli"
path = "src/lib.rs"

[dependencies]
digstore-core = { path = "../digstore-core" }
digstore-chain = { path = "../digstore-chain" }
rpassword = "7"
zeroize = "1"
digstore-store = { path = "../digstore-store" }
digstore-chunker = { path = "../digstore-chunker" }
digstore-compiler = { path = "../digstore-compiler" }
digstore-stage = { path = "../digstore-stage" }
digstore-host = { path = "../digstore-host" }
digstore-prover = { path = "../digstore-prover" }
digstore-remote = { path = "../digstore-remote" }
digstore-crypto = { path = "../digstore-crypto" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
anyhow = "1"
thiserror = "1"
chia-protocol = "0.26"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
hex = "0.4"
base64 = "0.22"
getrandom = "0.2"
# `dig-store update` self-updater: extract the `dig-store` binary from a release
# `.tar.gz` asset (Linux aarch64 ships only a tarball). Pure-Rust (miniz_oxide).
flate2 = "1"
tar = "0.4"
anstream = "0.6"
anstyle = "1"
ignore = "0.4"
globset = "0.4"
indicatif = "0.17"
axum = "0.7"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
