[package]
name = "digstore-store"
license = "GPL-2.0-only"
description = "Host-side digstore Store entity: on-disk layout, staging, and generations."
version.workspace = true
edition = "2021"

[dependencies]
digstore-core = { workspace = true }
digstore-chunker = { workspace = true }
digstore-crypto = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
