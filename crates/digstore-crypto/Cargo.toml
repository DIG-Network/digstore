[package]
name = "digstore-crypto"
license = "GPL-2.0-only"
version.workspace = true
edition = "2021"
description = "Host-side cryptography for Digstore: URN key derivation, AES-256-GCM chunk encryption, and Chia AugScheme BLS."

[dependencies]
# The AES-256-GCM-SIV seal + HKDF derivation now live in `digstore_core::crypto`
# (the single source of truth shared with the producer + browser verifier); this
# crate re-exports them via `aead`/`kdf` and adds BLS. So `aes-gcm-siv`/`hkdf` are
# no longer direct deps here — they come transitively through `digstore-core`.
digstore-core = { workspace = true }
sha2 = "0.10"
# Held on the 0.36.1 line — the ceiling `chia-wallet-sdk` resolves (its latest is 0.36.0).
# The 0.4x primitives on crates.io are unreachable while the SDK sits there, and this crate
# must agree byte-for-byte with `digstore-chain`, which speaks the SDK's own BLS types.
# The frozen AugScheme known-answer vectors in `tests/fixtures/bls_vectors.json` pin the
# cryptographic output across any future move of this line.
chia-bls = "0.36.1"
hex = "0.4"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
