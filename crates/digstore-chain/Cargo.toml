[package]
name = "digstore-chain"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Chia on-chain layer for the DIG Network store (.dig) format: seed/key management, store anchoring via CHIP-0035 DataLayer singletons, DIG CAT payments, offers, and coinset queries."
repository = "https://github.com/DIG-Network/digs"
keywords = ["dig", "chia", "datalayer", "chip-0035", "blockchain"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]

[dependencies]
# The canonical `Capsule` (storeId:rootHash) identity. Store discovery returns the
# current + historical capsules of a user's stores, so the return types speak in the
# one ecosystem-wide capsule type rather than re-inventing the pair.
digstore-core = { workspace = true }
async-trait = "0.1"
bip39 = { version = "2", features = ["rand"] }
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
dirs = "5"
# Canonical coin-selection + consolidation primitive (dig-wallet-backend, epic #998 —
# supersedes the deprecated predecessor wallet crate). Provides the capped, high-value-first
# `select_for_spend`/`select_for_consolidation` (engine seam) used by the
# init/commit/deploy spend paths so ordering + the coin cap + NeedsConsolidation are
# shared across the ecosystem (never hand-rolled — §4.1 / Appendix B). The engine seam
# speaks in `chia_protocol::Coin` natively; engine-only (this crate never signs).
# Held at 0.29.0 — 0.29.1 splits `dig-constants` in two; see the note on that dep below.
dig-wallet-backend = { version = "0.29", default-features = false, features = ["engine"] }
datalayer-driver = "4"
# The `chia` umbrella crate has no 0.36 line (it jumps straight from 0.32 to 0.42), so the
# facades it used to provide are depended on directly, each pinned to the 0.36.1 line that
# chia-wallet-sdk 0.34 resolves: BLS keys, the consensus cost model, puzzle types (Memos,
# NFT metadata, offer payments), secp keys for vaults, and CLVM tree hashing.
chia-bls = "0.36.1"
chia-consensus = "0.36.1"
chia-puzzle-types = "0.36.1"
chia-secp = "0.36.1"
clvm-utils = "0.36.1"
chia-protocol = "0.36.1"
chia-sha2 = "0.36.1"
chia-sdk-coinset = "0.34"
# chip-0035 exposes the DataLayer driver primitives (Launcher::mint_datastore, etc.) so we
# can replicate chip35's mint with the digstore-scoped owner hint memo (datalayer_driver's
# mint_store hardcodes a single launcher hint and exposes no hint parameter).
# `offer-compression` decodes/encodes bech32 `offer1…` strings (chia_takeOffer); `chip-0035`
# exposes the DataLayer driver primitives.
chia-wallet-sdk = { version = "0.34", features = ["chip-0035", "offer-compression"] }
hex = "0.4"
hex-literal = "0.4"
indexmap = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
# Canonical `DIG_ASSET_ID` source (#969) — never a local hex-literal copy (Appendix B).
#
# HELD at 0.10, and `dig-wallet-backend` held at 0.29.0, deliberately — against the usual
# bring-deps-to-latest rule, because here the latest versions SPLIT the tree instead of
# advancing it.
#
# `dig-wallet-backend` 0.29.1 declares `dig-constants ^0.11` while still depending on
# `dig-tips` 0.2.0, whose own latest release pins `dig-constants ^0.10`. Those two
# requirements cannot be satisfied by one version, so adopting 0.29.1 resolves
# `dig-constants` TWICE and the spend path ends up holding two copies of the crate that
# owns `DIG_ASSET_ID`. Both lines agree on the asset id today, so nothing is mis-spent —
# but a constants crate resolving twice is a divergence waiting to happen, and one line
# per family beats the highest version number.
#
# Unblocked by a `dig-tips` release onto `dig-constants` 0.11; then both can move together.
dig-constants = "0.10"

[dev-dependencies]
tempfile = "3"
# Decode a built coin spend's conditions in the send tests (verify the payment output).
clvmr = "0.16.2"
clvm-traits = "0.36.1"
# Offer take-flow round-trip test: build a maker offer (NFT-for-DIG-CAT) and accept it
# end-to-end in the in-process Chia simulator, validating the assembled spend bundle.
chia-sdk-test = "0.34"
chia-puzzles = "0.20.3"
# #231 cost-bound proof: measure a batch's real CLVM cost via the Chia consensus cost model
# (`chia_consensus::spendbundle_conditions::run_spendbundle`) against the canonical
# MAINNET_CONSTANTS, to assert the per-item cost estimate is
# conservative. clvmr is already a dev-dep (the single locked version the consensus crate uses).
chia-sdk-types = "0.34"
anyhow = "1"
