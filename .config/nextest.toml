# cargo-nextest configuration.
#
# CI runs the suite under `cargo nextest run` (flaky-test management, #489)
# instead of `cargo test`. The two runners parallelize differently, and that
# difference broke one test:
#
#   digstore-cli's integration tests (crates/digstore-cli/tests/*.rs) each spawn
#   a child `digstore` process. Serving/reading through the real chia:// path
#   makes that child JIT-compile the guest wasm in wasmtime — several seconds of
#   CPU and a non-trivial memory spike per process. `cargo test` runs test
#   BINARIES one at a time, so only one such child compiles at a time. nextest
#   instead runs num-cpus tests from a single global pool, so on the 4-vCPU CI
#   runners several wasmtime compiles pile up at once and starve the
#   `cli_dev` dev-server child past its 40s readiness poll — failing
#   `dev_serves_real_read_path_with_injected_shims` ("dev server did not come
#   up") deterministically on both ubuntu-latest and windows-latest.
#
# Cap the heavy child-spawning integration tests to 2 concurrent so each gets
# enough CPU to start, while the fast in-process unit tests keep full
# parallelism. This mirrors why `cargo test` was green without giving up
# nextest's flaky-run detection.

[test-groups]
cli-integration = { max-threads = 2 }

[[profile.default.overrides]]
# `kind(test)` selects the integration tests under tests/ (not the crate's
# in-process unit tests), scoped to the digstore-cli package.
filter = 'package(digstore-cli) & kind(test)'
test-group = 'cli-integration'
