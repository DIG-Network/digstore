[workspace]
resolver = "2"
members = ["crates/digstore-core", "crates/digstore-chunker", "crates/digstore-crypto", "crates/digstore-store", "crates/digstore-guest", "crates/digstore-prover", "crates/digstore-host", "crates/digstore-compiler", "crates/digstore-stage", "crates/digstore-remote", "crates/digstore-cli", "crates/digstore-chain", "crates/dig-resolver", "crates/digstore-subscription"]
exclude = ["crates/digstore-prover/guest", "crates/dig-client-wasm"]

[workspace.package]
edition = "2021"
version = "0.29.0"
license = "GPL-2.0-only"

[workspace.dependencies]
# Every in-repo library crate is declared here with BOTH a path and a version, so that
# each one carries a real crates.io dependency in its published manifest — cargo refuses
# to publish a bare `path` dep. Locally the path always wins; the version is what
# downstream consumers resolve.
#
# Members reference each other as `{ workspace = true }` rather than `{ path = "../x" }`,
# which is what makes the whole workspace publishable instead of only `digstore-core`
# and `digstore-chain`. Two members are nonetheless NOT published — see the
# `# NC-7 exception:` comments on `digstore-stage` and `digstore-prover`.
#
# The version MUST equal `[workspace.package].version`, because every member inherits
# that value. `scripts/check-workspace-dep-versions.sh` enforces it in CI, so a release
# bump can never silently leave a published crate pointing at the previous version.
digstore-core = { path = "crates/digstore-core", version = "0.29.0" }
digstore-chain = { path = "crates/digstore-chain", version = "0.29.0" }
digstore-chunker = { path = "crates/digstore-chunker", version = "0.29.0" }
digstore-crypto = { path = "crates/digstore-crypto", version = "0.29.0" }
digstore-store = { path = "crates/digstore-store", version = "0.29.0" }
digstore-prover = { path = "crates/digstore-prover", version = "0.29.0" }
digstore-host = { path = "crates/digstore-host", version = "0.29.0" }
digstore-compiler = { path = "crates/digstore-compiler", version = "0.29.0" }
digstore-stage = { path = "crates/digstore-stage", version = "0.29.0" }
digstore-remote = { path = "crates/digstore-remote", version = "0.29.0" }
digstore-cli = { path = "crates/digstore-cli", version = "0.29.0" }
digstore-subscription = { path = "crates/digstore-subscription", version = "0.29.0" }

sha2 = "0.10"
proptest = "1"
hex = "0.4"

# Release hardening: keep integer-overflow checks ON in release builds. This
# code parses untrusted serialized input and does offset/length arithmetic;
# silent wrapping in release would turn a length-overflow bug into a memory
# safety / logic hazard. Cost is negligible for this workload.
[profile.release]
overflow-checks = true
debug-assertions = false
panic = "unwind"
