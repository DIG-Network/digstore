# ─────────────────────────────────────────────────────────────────────────────────────────────
# Publish this workspace's LIBRARY crates to crates.io (dig_ecosystem #680, #3149).
#
# TWO crates publish from here, and the ORDER between them is the whole point: `digstore-chain`
# depends on `digstore-core`, and crates.io refuses a crate whose dependency is not yet on the
# registry. So `chain` runs `needs: core` — release-first, bottom-up, exactly the order the crate
# hierarchy defines. The shared publish logic lives in `scripts/publish-crate.sh` so a fix to the
# skip-if-exists probe cannot land for one crate and be forgotten for the other.
#
# `digstore-core` is the store-format read-crypto crate downstream crates (e.g. dig-urn-resolver)
# want to depend on BY VERSION — crates.io forbids the git deps they use today, so the root fix is
# to publish digstore-core by-version. This crate has NO path/git dependencies (all deps are
# crates.io-versioned), so it publishes standalone.
#
# TRIGGER — deliberately NOT the `v*` tag and NOT the nightly cron:
#   • `v*` tags fire the BINARY release (release.yml) and are cut by nightly-release.yml. Reusing
#     `v*` here would re-attempt a crate publish on every binary release; crates.io rejects a
#     duplicate version, spamming red runs. So the crate publish rides its OWN tag namespace,
#     `digstore-core-v*` (e.g. `digstore-core-v0.13.4`), plus manual `workflow_dispatch`.
#   • The publish is IDEMPOTENT: it queries crates.io for the version first and NO-OPS if that
#     version is already published (skip-if-exists, mirroring the nightlies stable skip-if-tagged
#     posture), so a re-run or an accidental duplicate tag never fails red.
#
# The version published is the workspace version (digstore-core inherits `version.workspace = true`),
# so bump the workspace `[workspace.package].version`, merge, then push `digstore-core-vX.Y.Z`
# (or run this workflow via dispatch) to publish that version.
# ─────────────────────────────────────────────────────────────────────────────────────────────
name: Publish crates to crates.io

on:
  push:
    tags:
      # Retained: the original per-crate tag namespace for digstore-core alone.
      - 'digstore-core-v*'
      # Publishes BOTH crates, bottom-up. This is the normal release trigger.
      - 'digstore-crates-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test publishable crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt -p digstore-core -p digstore-chain -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy -p digstore-core -p digstore-chain --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test -p digstore-core -p digstore-chain --all-features --locked
      - name: Check documentation
        run: cargo doc -p digstore-core -p digstore-chain --no-deps --all-features --locked

  # ── Level 0: no in-repo dependencies, so it publishes standalone. ──────────────────────────
  publish-core:
    name: Publish digstore-core
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish
        run: bash scripts/publish-crate.sh digstore-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── Level 1: depends on digstore-core, so it CANNOT publish until that version is live. ────
  publish-chain:
    name: Publish digstore-chain
    runs-on: ubuntu-latest
    needs: publish-core
    # The digstore-core-only tag namespace must not drag digstore-chain along with it.
    if: "!startsWith(github.ref, 'refs/tags/digstore-core-v')"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish
        run: bash scripts/publish-crate.sh digstore-chain
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
