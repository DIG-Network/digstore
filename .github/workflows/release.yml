# STABLE binary release. On a `vX.Y.Z` tag (cut by the nightly-release orchestrator's stable job
# — nightly-release.yml — either from the midnight cron detecting a version bump or from a manual
# `workflow_dispatch`), this workflow builds the raw `dig-store` CLI + its `digs` alias for every
# OS/arch, in the two asset shapes both installers consume (bare per-OS binaries + apt tarballs, via
# the reusable build workflow), and publishes them to a STABLE GitHub Release. It ALSO uploads the
# Linux x86_64 binary to the dighub S3 artifact bucket for the hub compile-worker. The changelog is
# already inside the tag (the orchestrator committed it before tagging).
#
# This is intentionally tag-ONLY: merges to main no longer build or release here (dig_ecosystem
# #590 batches releases to the nightly cron + manual dispatch). Pre-merge coverage comes from ci.yml
# (fmt/clippy/test/coverage on every PR); daily main-HEAD build coverage comes from the nightly
# channel. A `workflow_dispatch` is kept as a manual "does main still build?" canary — it builds but
# does not publish (publish + S3 upload are gated on a tag ref).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only the write scope needed to publish the release + upload the asset.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Resolve the version string the artifacts are stamped with: `X.Y.Z` from a `vX.Y.Z` tag, or a
  # `g<shortsha>` build id for the manual canary (which never publishes).
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: v
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=g$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # Build every OS/arch through the shared reusable workflow — the same build the nightly channel
  # uses, so the two release paths can never diverge on how a binary is produced.
  build:
    name: Build
    needs: meta
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      # Empty ref => build the tag/commit this run is on.
      ref: ""

  # ---------------------------------------------------------------------------
  # Single publish job — runs after ALL matrix builds so there is no race to
  # create the GitHub Release. Tag only (the dispatch canary builds but stops).
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # The publish job does not checkout the repo, so gh has no local git
          # context — pass --repo explicitly (else `gh release create` errors
          # with "not a git repository").
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist-all
          find dist -type f -exec cp {} dist-all/ \;
          ls -la dist-all
          gh release create "${GITHUB_REF_NAME}" --repo "$GH_REPO" --title "dig-store ${GITHUB_REF_NAME}" --generate-notes || echo "release already exists"
          gh release upload "${GITHUB_REF_NAME}" --repo "$GH_REPO" dist-all/* --clobber

  # ---------------------------------------------------------------------------
  # Publish the raw Linux x86_64 `digstore` binary to the dighub S3 artifact
  # bucket, so the hub compile-worker can SYNC the latest binary at runtime
  # (it shells out to `digstore compile` to build stores from staged files).
  # Layout:
  #   digstore/<version>/digstore   — the binary for this release
  #   digstore/latest.json          — { version, key, sha256 } the worker reads
  # Auth is GitHub OIDC into a dedicated dighub role (S3 PutObject on the bucket
  # only); configure these repo settings:
  #   secret AWS_ARTIFACT_ROLE_ARN, var AWS_REGION, var DIGSTORE_ARTIFACT_BUCKET
  # The job no-ops (does not fail the release) when they are absent. Tag only —
  # a nightly must never move the `latest` binary the hub worker reads.
  publish-s3-binary:
    name: Publish digstore binary to S3
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Skip if AWS artifact bucket is not configured
        id: gate
        run: |
          if [ -z "${{ secrets.AWS_ARTIFACT_ROLE_ARN }}" ] || [ -z "${{ vars.DIGSTORE_ARTIFACT_BUCKET }}" ]; then
            echo "AWS artifact publishing not configured (set AWS_ARTIFACT_ROLE_ARN + DIGSTORE_ARTIFACT_BUCKET); skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Rust toolchain
        if: steps.gate.outputs.enabled == 'true'
        run: rustup show

      - name: Build guest wasm
        if: steps.gate.outputs.enabled == 'true'
        run: cargo build -p digstore-guest --target wasm32-unknown-unknown --release --locked

      - name: Build dig-store CLI (Linux x86_64, release)
        if: steps.gate.outputs.enabled == 'true'
        run: cargo build -p digstore-cli --release --locked

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARTIFACT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload binary + version marker to S3
        if: steps.gate.outputs.enabled == 'true'
        env:
          BUCKET: ${{ vars.DIGSTORE_ARTIFACT_BUCKET }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # The binary was renamed `digstore` -> `dig-store` (#703). The dighub S3 layout
          # (`digstore/<ver>/digstore` + `digstore/latest.json`) is the hub compile-worker's
          # contract and is UNCHANGED here — only the local build artifact name changed.
          BIN=target/release/dig-store
          test -f "$BIN" || { echo "missing $BIN"; exit 1; }
          SHA=$(sha256sum "$BIN" | cut -d' ' -f1)
          KEY="digstore/${VERSION}/digstore"
          echo "publishing $BIN ($SHA) -> s3://$BUCKET/$KEY"
          aws s3 cp "$BIN" "s3://$BUCKET/$KEY" \
            --content-type application/octet-stream \
            --metadata "sha256=$SHA,version=$VERSION"
          # The version marker the worker polls. Written LAST so a half-uploaded
          # binary is never advertised as latest.
          printf '{"version":"%s","key":"%s","sha256":"%s"}\n' "$VERSION" "$KEY" "$SHA" > latest.json
          aws s3 cp latest.json "s3://$BUCKET/digstore/latest.json" \
            --content-type application/json --cache-control "no-cache"
          echo "published digstore ${VERSION}"
